{% extends "base.html" %}
{% block title %}Assign {{ chore.title }} · Choreo{% endblock %}
{% block content %}
  <h1>Assign &ldquo;{{ chore.title }}&rdquo;</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit">Assign</button>
        <a class="button secondary" href="{% url 'chore_list' %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
