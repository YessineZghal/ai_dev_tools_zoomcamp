{% extends "base.html" %}
{% block title %}{{ verb }} chore · Choreo{% endblock %}
{% block content %}
  <h1>{{ verb }} chore</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit">Save</button>
        <a class="button secondary" href="{% url 'chore_list' %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
